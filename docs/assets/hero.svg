<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" fill="none" role="img" aria-label="Rachit Pandey — Full-Stack TypeScript and AI Engineer">
  <title>Rachit Pandey — Full-Stack TypeScript &amp; AI Engineer</title>
  <defs>
    <!-- ============ surfaces ============ -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F17"/>
      <stop offset=".55" stop-color="#080A10"/>
      <stop offset="1" stop-color="#0A0C13"/>
    </linearGradient>

    <!-- ============ aurora blobs ============ -->
    <radialGradient id="b1" cx=".5" cy=".5" r=".5">
      <stop stop-color="#8B5CF6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx=".5" cy=".5" r=".5">
      <stop stop-color="#22D3EE" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx=".5" cy=".5" r=".5">
      <stop stop-color="#34D399" stop-opacity=".26"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <!-- ============ text gradients ============ -->
    <linearGradient id="gradText" x1="300" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#C9D4FF"/>
      <stop offset=".68" stop-color="#7CE7F5"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="gradLine" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- ============ patterns / filters ============ -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <clipPath id="frame"><rect x="1" y="1" width="1278" height="378" rx="22"/></clipPath>

    <style>
      @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(70px,-26px)} }
      @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-64px,30px)} }
      @keyframes float3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(46px,34px)} }
      @keyframes sweep  { 0%{transform:translateX(-620px)} 100%{transform:translateX(1320px)} }
      @keyframes blink  { 0%,48%{opacity:1} 49%,100%{opacity:0} }
      @keyframes pulse  { 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:1;transform:scale(1.35)} }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .b1 { animation: float1 17s ease-in-out infinite; }
      .b2 { animation: float2 21s ease-in-out infinite; }
      .b3 { animation: float3 25s ease-in-out infinite; }
      .sweep { animation: sweep 7s cubic-bezier(.4,0,.2,1) infinite; }
      .caret { animation: blink 1.15s steps(1) infinite; }
      /* No entrance animation on the text on purpose: `animation-fill-mode: both`
         starts elements at opacity 0, so any renderer that grabs a frame before
         animations start (static rasterisers, reduced-motion, PDF export) shows
         NO text at all. Text must never depend on animation to be visible. */
      .halo { animation: pulse 2.6s ease-in-out infinite; transform-origin: 1046px 190px; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#grid)"/>

    <!-- aurora field -->
    <g filter="url(#soft)">
      <circle class="b1" cx="180" cy="70"  r="210" fill="url(#b1)"/>
      <circle class="b2" cx="1080" cy="90" r="200" fill="url(#b2)"/>
      <circle class="b3" cx="820" cy="360" r="190" fill="url(#b3)"/>
    </g>

    <!-- shimmer sweep -->
    <rect class="sweep" x="-620" y="0" width="330" height="380" fill="url(#shimmer)" transform="skewX(-18)"/>

    <!-- top accent line -->
    <rect x="0" y="0" width="1280" height="2" fill="url(#gradLine)"/>

    <!-- text block -->
    <g class="sans">
      <!-- availability pill: LinkedIn "Open to Work" styling (#0A66C2) -->
      <g>
        <rect x="64" y="62" width="188" height="34" rx="6" fill="#0A66C2"/>
        <circle class="halo" cx="86" cy="79" r="5" fill="#FFFFFF"/>
        <text class="sans" x="102" y="84" font-size="13" font-weight="600" fill="#FFFFFF" letter-spacing=".1">Open to Work</text>
      </g>

      <!-- name -->
      <text x="64" y="176" font-size="72" font-weight="700" fill="#E9EDF6" letter-spacing="-2.4">Rachit Pandey</text>

      <!-- role -->
      <text x="64" y="228" font-size="27" font-weight="600" fill="url(#gradText)" letter-spacing="-.4">
        Full-Stack TypeScript <tspan fill-opacity=".55">×</tspan> AI <tspan fill-opacity=".55">×</tspan> Cloud Engineer
      </text>

      <!-- subline -->
      <text class="sans" x="64" y="266" font-size="15" font-weight="400" fill="#97A1B5">
        I build production SaaS, multi-tenant POS platforms and code-intelligence tooling.
      </text>

      <!-- tech chips -->
      <g class="sans">
        <rect x="64" y="292" width="96"  height="30" rx="9" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
        <text x="112" y="311" font-size="12.5" fill="#C8D1E2" text-anchor="middle">TypeScript</text>

        <rect x="170" y="292" width="86"  height="30" rx="9" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
        <text x="213" y="311" font-size="12.5" fill="#C8D1E2" text-anchor="middle">Angular</text>

        <rect x="266" y="292" width="70"  height="30" rx="9" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
        <text x="301" y="311" font-size="12.5" fill="#C8D1E2" text-anchor="middle">React</text>

        <rect x="346" y="292" width="86"  height="30" rx="9" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
        <text x="389" y="311" font-size="12.5" fill="#C8D1E2" text-anchor="middle">Node.js</text>

        <rect x="442" y="292" width="82"  height="30" rx="9" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
        <text x="483" y="311" font-size="12.5" fill="#C8D1E2" text-anchor="middle">Python</text>

        <rect x="534" y="292" width="70"  height="30" rx="9" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
        <text x="569" y="311" font-size="12.5" fill="#C8D1E2" text-anchor="middle">Postgres</text>

        <rect x="614" y="292" width="62"  height="30" rx="9" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
        <text x="645" y="311" font-size="12.5" fill="#C8D1E2" text-anchor="middle">AWS</text>
      </g>

      <!-- prompt + typing cursor -->
      <text class="mono" x="64" y="352" font-size="14" fill="#6C7689">&gt; whoami</text>
      <rect class="caret" x="146" y="340" width="9" height="16" rx="2" fill="#22D3EE"/>
    </g>

    <!-- GitHub avatar: base64-embedded because SVG loaded through <img> cannot
         fetch remote resources. This is the account identicon (420x420 PNG,
         1515 bytes) captured from https://github.com/its-skark.png. To use a
         real photo after uploading one to GitHub, replace ONLY the base64 on
         the next line; keep it a single unbroken line. -->
    <g>
      <circle cx="1046" cy="190" r="96" fill="#0D1119" stroke="#FFFFFF" stroke-opacity=".1"/>
      <circle cx="1046" cy="190" r="118" fill="none" stroke="#22D3EE" stroke-opacity=".22" stroke-dasharray="5 12">
        <animateTransform attributeName="transform" type="rotate" from="0 1046 190" to="360 1046 190" dur="34s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1046" cy="190" r="134" fill="none" stroke="#8B5CF6" stroke-opacity=".2" stroke-dasharray="3 16">
        <animateTransform attributeName="transform" type="rotate" from="360 1046 190" to="0 1046 190" dur="48s" repeatCount="indefinite"/>
      </circle>
      <defs>
        <clipPath id="avatarClip"><circle cx="1046" cy="190" r="88"/></clipPath>
        <linearGradient id="avatarRing" x1="980" y1="140" x2="1112" y2="240" gradientUnits="userSpaceOnUse">
          <stop stop-color="#8B5CF6"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/>
        </linearGradient>
      </defs>
      <image x="958" y="102" width="176" height="176" preserveAspectRatio="xMidYMid slice"
             clip-path="url(#avatarClip)" href="data:image/png;base64," />
      <circle cx="1046" cy="190" r="89.5" fill="none" stroke="url(#avatarRing)" stroke-width="3"/>
    </g>
  </g>

  <rect x="1" y="1" width="1278" height="378" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".1"/>
</svg>